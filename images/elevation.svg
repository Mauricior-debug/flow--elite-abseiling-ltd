<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img">
  <title>Facade elevation with a rope-access line</title>
  <style>
    .rope-path { stroke-dasharray: 10 8; animation: pay 18s linear infinite; }
